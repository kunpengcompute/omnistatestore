<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img">
  <defs>
    <style>
      .title{font:700 25px "Microsoft YaHei",sans-serif;fill:#183153}
      .label{font:600 17px "Microsoft YaHei",sans-serif;fill:#183153}
      .text{font:15px "Microsoft YaHei",sans-serif;fill:#334155}
      .num{font:14px Consolas,monospace;fill:#334155}
      .white{font:600 16px "Microsoft YaHei",sans-serif;fill:#fff}
    </style>
    <marker id="a1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6 Z" fill="#2563eb"/></marker>
    <marker id="a2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6 Z" fill="#7c3aed"/></marker>
  </defs>
  <rect width="1200" height="500" rx="18" fill="#f8fafc"/>
  <text x="48" y="48" class="title">扩容 1→2：一个宽旧 bucket 拆成两个窄目标 bucket</text>

  <text x="48" y="94" class="label">旧 Mapper：Task 持有 KG [0..15]，bucket 8 覆盖整段数据</text>
  <rect x="160" y="118" width="880" height="82" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <rect x="160" y="118" width="440" height="82" rx="10" fill="#2563eb"/>
  <rect x="600" y="118" width="440" height="82" rx="10" fill="#7c3aed"/>
  <text x="380" y="153" text-anchor="middle" class="white">旧 bucket 8 · 左半</text>
  <text x="380" y="178" text-anchor="middle" class="white">1073741824..1140850687</text>
  <text x="820" y="153" text-anchor="middle" class="white">旧 bucket 8 · 右半</text>
  <text x="820" y="178" text-anchor="middle" class="white">1140850688..1207959551</text>

  <path d="M380 210 C380 260 300 260 300 302" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#a1)"/>
  <path d="M820 210 C820 260 900 260 900 302" fill="none" stroke="#7c3aed" stroke-width="4" marker-end="url(#a2)"/>
  <text x="600" y="252" text-anchor="middle" class="label">targetMapper.Map(overlap.start..end) = bucket [0..1]</text>

  <text x="48" y="302" class="label">目标 Mapper：Task 持有 KG [8..15]，bucket 宽度减半</text>
  <rect x="160" y="326" width="400" height="78" rx="10" fill="#2563eb"/>
  <rect x="640" y="326" width="400" height="78" rx="10" fill="#7c3aed"/>
  <text x="360" y="359" text-anchor="middle" class="white">目标 bucket 0</text>
  <text x="360" y="384" text-anchor="middle" class="white">只保留左半区 key</text>
  <text x="840" y="359" text-anchor="middle" class="white">目标 bucket 1</text>
  <text x="840" y="384" text-anchor="middle" class="white">只保留右半区 key</text>

  <rect x="160" y="430" width="880" height="42" rx="9" fill="#fff7ed" stroke="#fb923c"/>
  <text x="600" y="457" text-anchor="middle" class="text">fanout=2 → DeepCopy(true) → 两个 slot 均强制 Compaction，分别过滤出自己的半区</text>
</svg>
