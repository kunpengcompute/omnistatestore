<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#1f2937"/>
    </marker>
    <marker id="orangeArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#d35400"/>
    </marker>
    <pattern id="disabled" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="14" height="14" fill="#f3f4f6"/>
      <line x1="0" y1="0" x2="0" y2="14" stroke="#cbd5e1" stroke-width="3"/>
    </pattern>
    <style>
      .title{font:700 36px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#17365d}
      .h2{font:700 25px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#17365d}
      .axis{font:700 22px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#17365d}
      .body{font:500 21px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#1f2937}
      .small{font:500 18px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#475569}
      .hval{font:700 22px Consolas,"Microsoft YaHei",monospace;fill:#b54708}
      .oval{font:700 20px Consolas,"Microsoft YaHei",monospace;fill:#18723a}
      .grid{stroke-width:2;rx:10}
      .arrow{stroke:#1f2937;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="1050" fill="#fff"/>
  <text x="55" y="66" class="title">商余坐标系：每个格子同时展示原始编号与重排编号</text>
  <text x="55" y="108" class="small">示例 H=16，M=3。横轴 r=keyGroup，纵轴 q=组内序号。</text>

  <rect x="1080" y="45" width="185" height="70" fill="#fff4e5" stroke="#d35400" stroke-width="2" rx="10"/>
  <text x="1172" y="76" text-anchor="middle" class="hval">h = 原始哈希</text>
  <text x="1172" y="100" text-anchor="middle" class="small">按行递增</text>
  <rect x="1285" y="45" width="250" height="70" fill="#e7f4e8" stroke="#2e8b3c" stroke-width="2" rx="10"/>
  <text x="1410" y="76" text-anchor="middle" class="oval">o = orderHash</text>
  <text x="1410" y="100" text-anchor="middle" class="small">按列连续编号</text>

  <line x1="195" y1="820" x2="970" y2="820" stroke="#17365d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="195" y1="820" x2="195" y2="150" stroke="#17365d" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="980" y="827" class="axis">r（keyGroup）</text>
  <text x="92" y="166" class="axis">q（组内序号）</text>

  <g class="axis" text-anchor="middle">
    <text x="335" y="858">r=0</text><text x="575" y="858">r=1</text><text x="815" y="858">r=2</text>
  </g>
  <g class="axis" text-anchor="end">
    <text x="174" y="240">q=5</text><text x="174" y="345">q=4</text><text x="174" y="450">q=3</text>
    <text x="174" y="555">q=2</text><text x="174" y="660">q=1</text><text x="174" y="765">q=0</text>
  </g>

  <!-- q=5 -->
  <rect x="220" y="180" width="230" height="82" class="grid" fill="#dce9f7" stroke="#2f77c5"/>
  <text x="245" y="213" class="hval">h=15</text><text x="245" y="244" class="oval">o=5</text>
  <rect x="460" y="180" width="230" height="82" class="grid" fill="url(#disabled)" stroke="#94a3b8"/>
  <text x="575" y="228" text-anchor="middle" class="small">不存在：h≥16</text>
  <rect x="700" y="180" width="230" height="82" class="grid" fill="url(#disabled)" stroke="#94a3b8"/>
  <text x="815" y="228" text-anchor="middle" class="small">不存在：h≥16</text>

  <!-- q=4 -->
  <rect x="220" y="285" width="230" height="82" class="grid" fill="#dce9f7" stroke="#2f77c5"/>
  <text x="245" y="318" class="hval">h=12</text><text x="245" y="349" class="oval">o=4</text>
  <rect x="460" y="285" width="230" height="82" class="grid" fill="#e7f4e8" stroke="#d35400" stroke-width="4"/>
  <text x="485" y="318" class="hval">h=13</text><text x="485" y="349" class="oval">o=10</text>
  <rect x="700" y="285" width="230" height="82" class="grid" fill="#f1e8fa" stroke="#8659b5"/>
  <text x="725" y="318" class="hval">h=14</text><text x="725" y="349" class="oval">o=15</text>

  <!-- q=3 -->
  <rect x="220" y="390" width="230" height="82" class="grid" fill="#dce9f7" stroke="#2f77c5"/>
  <text x="245" y="423" class="hval">h=9</text><text x="245" y="454" class="oval">o=3</text>
  <rect x="460" y="390" width="230" height="82" class="grid" fill="#e7f4e8" stroke="#2e8b3c"/>
  <text x="485" y="423" class="hval">h=10</text><text x="485" y="454" class="oval">o=9</text>
  <rect x="700" y="390" width="230" height="82" class="grid" fill="#f1e8fa" stroke="#8659b5"/>
  <text x="725" y="423" class="hval">h=11</text><text x="725" y="454" class="oval">o=14</text>

  <!-- q=2 -->
  <rect x="220" y="495" width="230" height="82" class="grid" fill="#dce9f7" stroke="#2f77c5"/>
  <text x="245" y="528" class="hval">h=6</text><text x="245" y="559" class="oval">o=2</text>
  <rect x="460" y="495" width="230" height="82" class="grid" fill="#e7f4e8" stroke="#2e8b3c"/>
  <text x="485" y="528" class="hval">h=7</text><text x="485" y="559" class="oval">o=8</text>
  <rect x="700" y="495" width="230" height="82" class="grid" fill="#f1e8fa" stroke="#8659b5"/>
  <text x="725" y="528" class="hval">h=8</text><text x="725" y="559" class="oval">o=13</text>

  <!-- q=1 -->
  <rect x="220" y="600" width="230" height="82" class="grid" fill="#dce9f7" stroke="#2f77c5"/>
  <text x="245" y="633" class="hval">h=3</text><text x="245" y="664" class="oval">o=1</text>
  <rect x="460" y="600" width="230" height="82" class="grid" fill="#e7f4e8" stroke="#2e8b3c"/>
  <text x="485" y="633" class="hval">h=4</text><text x="485" y="664" class="oval">o=7</text>
  <rect x="700" y="600" width="230" height="82" class="grid" fill="#f1e8fa" stroke="#8659b5"/>
  <text x="725" y="633" class="hval">h=5</text><text x="725" y="664" class="oval">o=12</text>

  <!-- q=0 -->
  <rect x="220" y="705" width="230" height="82" class="grid" fill="#dce9f7" stroke="#2f77c5"/>
  <text x="245" y="738" class="hval">h=0</text><text x="245" y="769" class="oval">o=0</text>
  <rect x="460" y="705" width="230" height="82" class="grid" fill="#e7f4e8" stroke="#2e8b3c"/>
  <text x="485" y="738" class="hval">h=1</text><text x="485" y="769" class="oval">o=6</text>
  <rect x="700" y="705" width="230" height="82" class="grid" fill="#f1e8fa" stroke="#8659b5"/>
  <text x="725" y="738" class="hval">h=2</text><text x="725" y="769" class="oval">o=11</text>

  <path d="M690 326 H695 V140 H1030 V245 H1040" stroke="#d35400" stroke-width="3" fill="none"
        marker-end="url(#orangeArrow)"/>
  <rect x="1050" y="245" width="480" height="235" fill="#fff4e5" stroke="#d35400" stroke-width="2" rx="14"/>
  <text x="1090" y="292" class="h2">单值定位：h=13</text>
  <text x="1090" y="337" class="body">q = 13 / 3 = 4</text>
  <text x="1090" y="373" class="body">r = 13 % 3 = 1</text>
  <text x="1090" y="409" class="body">prefix(1) = 6</text>
  <text x="1090" y="445" class="body">orderHash = 6 + 4 = 10</text>

  <text x="60" y="915" class="h2">按列收拢后的输出数轴</text>
  <g transform="translate(410,875)">
    <rect x="0" y="0" width="360" height="92" fill="#dce9f7" stroke="#2f77c5" stroke-width="2"/>
    <rect x="360" y="0" width="300" height="92" fill="#e7f4e8" stroke="#2e8b3c" stroke-width="2"/>
    <rect x="660" y="0" width="300" height="92" fill="#f1e8fa" stroke="#8659b5" stroke-width="2"/>
    <text x="180" y="37" text-anchor="middle" class="body">r=0：o 0–5（6 个）</text>
    <text x="510" y="37" text-anchor="middle" class="body">r=1：o 6–10（5 个）</text>
    <text x="810" y="37" text-anchor="middle" class="body">r=2：o 11–15（5 个）</text>
    <text x="180" y="70" text-anchor="middle" class="small">长组：多一个 q=5</text>
    <text x="510" y="70" text-anchor="middle" class="small">普通组</text>
    <text x="810" y="70" text-anchor="middle" class="small">普通组</text>
  </g>
</svg>
