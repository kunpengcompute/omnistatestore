<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#1f2937"/>
    </marker>
    <style>
      .title{font:700 36px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#17365d}
      .h2{font:700 25px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#17365d}
      .body{font:500 21px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#1f2937}
      .small{font:500 18px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#475569}
      .formula{font:700 20px Consolas,"Microsoft YaHei",monospace;fill:#17365d}
      .box{stroke-width:2;rx:14}
      .arrow{stroke:#1f2937;stroke-width:4;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="950" fill="#fff"/>
  <text x="60" y="70" class="title">商余重排在 OmniStateStore 数据链路中的位置</text>

  <rect x="70" y="150" width="230" height="120" class="box" fill="#f2f4f7" stroke="#64748b"/>
  <text x="185" y="195" text-anchor="middle" class="h2">Flink Key</text>
  <text x="185" y="232" text-anchor="middle" class="small">MathUtils.murmurHash</text>
  <path d="M300 210 H380" class="arrow"/>

  <rect x="385" y="150" width="250" height="120" class="box" fill="#dce9f7" stroke="#2f77c5"/>
  <text x="510" y="195" text-anchor="middle" class="h2">rawHash</text>
  <text x="510" y="232" text-anchor="middle" class="formula">0 ≤ h &lt; 2³¹</text>
  <path d="M635 210 H715" class="arrow"/>

  <rect x="720" y="150" width="300" height="120" class="box" fill="#fff4e5" stroke="#d35400"/>
  <text x="870" y="192" text-anchor="middle" class="h2">商余重排</text>
  <text x="870" y="228" text-anchor="middle" class="formula">r=h%M, q=h/M</text>
  <text x="870" y="255" text-anchor="middle" class="small">orderHash=prefix(r)+q</text>
  <path d="M1020 210 H1100" class="arrow"/>

  <rect x="1105" y="150" width="280" height="120" class="box" fill="#e7f4e8" stroke="#2e8b3c"/>
  <text x="1245" y="195" text-anchor="middle" class="h2">QueryKey</text>
  <text x="1245" y="232" text-anchor="middle" class="small">stateId + orderHash + key</text>

  <path d="M1245 270 V315 H355 V345" class="arrow"/>
  <text x="60" y="330" class="h2">三层存储主线</text>
  <g transform="translate(200,350)">
    <rect x="0" y="0" width="310" height="120" class="box" fill="#dce9f7" stroke="#2f77c5"/>
    <text x="155" y="46" text-anchor="middle" class="h2">FreshTable</text>
    <text x="155" y="82" text-anchor="middle" class="small">连续 q 提升低位桶利用</text>
    <path d="M310 60 H405" class="arrow"/>
    <rect x="410" y="0" width="310" height="120" class="box" fill="#f2f4f7" stroke="#64748b"/>
    <text x="565" y="46" text-anchor="middle" class="h2">SliceTable</text>
    <text x="565" y="82" text-anchor="middle" class="small">解码 key-group / 路由</text>
    <path d="M720 60 H815" class="arrow"/>
    <rect x="820" y="0" width="310" height="120" class="box" fill="#e7f4e8" stroke="#2e8b3c"/>
    <text x="975" y="46" text-anchor="middle" class="h2">LsmStore</text>
    <text x="975" y="82" text-anchor="middle" class="small">同组连续 / order range</text>
  </g>

  <path d="M765 470 V510 H800" stroke="#1f2937" stroke-width="4" fill="none"/>
  <path d="M1175 470 V510 H800 V525" class="arrow"/>
  <rect x="650" y="530" width="300" height="78" class="box" fill="#f2f4f7" stroke="#64748b"/>
  <text x="800" y="562" text-anchor="middle" class="h2">有序内部键</text>
  <text x="800" y="590" text-anchor="middle" class="small">Slice + LSM 归并 / order range</text>

  <path d="M800 608 V630 H505 V645" class="arrow"/>
  <path d="M800 630 H1095 V645" class="arrow"/>
  <rect x="245" y="650" width="520" height="125" class="box" fill="#fff4e5" stroke="#d35400"/>
  <text x="505" y="692" text-anchor="middle" class="h2">Checkpoint / Restore Filter</text>
  <text x="505" y="727" text-anchor="middle" class="small">orderHash → keyGroup → range filter</text>
  <text x="505" y="753" text-anchor="middle" class="small">只保留目标 key-group</text>

  <rect x="835" y="650" width="520" height="125" class="box" fill="#e7f4e8" stroke="#2e8b3c"/>
  <text x="1095" y="692" text-anchor="middle" class="h2">Savepoint Iterator</text>
  <text x="1095" y="727" text-anchor="middle" class="small">按 orderHash 遍历并恢复 key-group</text>
  <text x="1095" y="753" text-anchor="middle" class="small">输出 key-group 单调不减</text>

  <rect x="160" y="825" width="1280" height="90" class="box" fill="#eef5fc" stroke="#2f77c5"/>
  <text x="205" y="864" class="h2">业务映射结论</text>
  <text x="430" y="864" class="body">同一个 orderHash 同时服务于内存分桶、分层路由、文件范围过滤和 Savepoint 顺序。</text>
  <text x="205" y="895" class="small">算法性质贯穿写入、分层存储、恢复过滤和导出，不是脱离工程链路的数学变换。</text>
</svg>
