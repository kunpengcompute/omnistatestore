<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <defs><style>.title{font:700 25px "Noto Sans",Arial,sans-serif;fill:#183153}.label{font:600 17px "Noto Sans",Arial,sans-serif;fill:#183153}.text{font:15px "Noto Sans",Arial,sans-serif;fill:#334155}.small{font:14px "Noto Sans",Arial,sans-serif;fill:#475569}.white{font:600 16px "Noto Sans",Arial,sans-serif;fill:#fff}</style><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6 Z" fill="#2563eb"/></marker></defs>
  <rect width="1200" height="600" rx="18" fill="#f8fafc"/><text x="48" y="48" class="title">One-Slot Rolling Strong Cache: Decode Each Snapshot Slice Once</text><text x="48" y="82" class="text">Scenario: after scale-out splitting, target slots 0 and 1 both reference Snapshot payload A</text>
  <line x1="110" y1="130" x2="110" y2="536" stroke="#94a3b8" stroke-width="3"/><circle cx="110" cy="160" r="10" fill="#2563eb"/><circle cx="110" cy="330" r="10" fill="#7c3aed"/><circle cx="110" cy="510" r="10" fill="#0f766e"/>
  <text x="52" y="165" class="label">slot 0</text><rect x="160" y="116" width="246" height="88" rx="12" fill="#dbeafe" stroke="#60a5fa"/><text x="283" y="148" text-anchor="middle" class="label">Read + decompress A</text><text x="283" y="177" text-anchor="middle" class="small">Create SliceRef A</text><path d="M414 160 L494 160" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><rect x="510" y="116" width="246" height="88" rx="12" fill="#2563eb"/><text x="633" y="148" text-anchor="middle" class="white">currentSlot</text><text x="633" y="177" text-anchor="middle" class="white">Strong reference A</text><path d="M764 160 L844 160" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><rect x="860" y="116" width="260" height="88" rx="12" fill="#ecfdf5" stroke="#34d399"/><text x="990" y="148" text-anchor="middle" class="label">Compaction slot 0</text><text x="990" y="177" text-anchor="middle" class="small">Then CompleteSlot()</text>
  <path d="M990 214 C990 258 820 264 754 294" fill="none" stroke="#7c3aed" stroke-width="3" marker-end="url(#arrow)"/><text x="52" y="335" class="label">slot 1</text><rect x="160" y="286" width="246" height="88" rx="12" fill="#ede9fe" stroke="#a78bfa"/><text x="283" y="318" text-anchor="middle" class="label">Find(payload A)</text><text x="283" y="347" text-anchor="middle" class="small">Hit in previousSlot</text><path d="M414 330 L494 330" stroke="#7c3aed" stroke-width="3" marker-end="url(#arrow)"/><rect x="510" y="286" width="246" height="88" rx="12" fill="#7c3aed"/><text x="633" y="318" text-anchor="middle" class="white">Promote to currentSlot</text><text x="633" y="347" text-anchor="middle" class="white">Reuse SliceRef A</text><path d="M764 330 L844 330" stroke="#7c3aed" stroke-width="3" marker-end="url(#arrow)"/><rect x="860" y="286" width="260" height="88" rx="12" fill="#ecfdf5" stroke="#34d399"/><text x="990" y="318" text-anchor="middle" class="label">Compaction slot 1</text><text x="990" y="347" text-anchor="middle" class="small">No repeated read/decompression</text>
  <path d="M990 384 C990 430 820 444 754 478" fill="none" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)"/><text x="52" y="515" class="label">Roll</text><rect x="160" y="464" width="596" height="92" rx="12" fill="#f1f5f9" stroke="#94a3b8"/><text x="458" y="497" text-anchor="middle" class="label">Keep only adjacent windows</text><text x="458" y="526" text-anchor="middle" class="text">previousSlot ← currentSlot; release older unused strong references</text><rect x="820" y="464" width="300" height="92" rx="12" fill="#fff7ed" stroke="#fb923c"/><text x="970" y="497" text-anchor="middle" class="label">Enablement and lifetime</text><text x="970" y="526" text-anchor="middle" class="small">compositeNum&gt;1 or force=true; not global</text>
</svg>
