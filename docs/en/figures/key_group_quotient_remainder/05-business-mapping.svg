<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950">
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#1f2937"/></marker><style>.title{font:700 36px "Noto Sans",Arial,sans-serif;fill:#17365d}.h2{font:700 25px "Noto Sans",Arial,sans-serif;fill:#17365d}.body{font:500 21px "Noto Sans",Arial,sans-serif;fill:#1f2937}.small{font:500 18px "Noto Sans",Arial,sans-serif;fill:#475569}.formula{font:700 20px Consolas,monospace;fill:#17365d}.box{stroke-width:2;rx:14}.arrow{stroke:#1f2937;stroke-width:4;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect width="1600" height="950" fill="#fff"/><text x="60" y="70" class="title">Quotient–Remainder Reordering in the OmniStateStore Data Flow</text>
  <rect x="70" y="150" width="230" height="120" class="box" fill="#f2f4f7" stroke="#64748b"/><text x="185" y="195" text-anchor="middle" class="h2">Flink Key</text><text x="185" y="232" text-anchor="middle" class="small">MathUtils.murmurHash</text><path d="M300 210 H380" class="arrow"/>
  <rect x="385" y="150" width="250" height="120" class="box" fill="#dce9f7" stroke="#2f77c5"/><text x="510" y="195" text-anchor="middle" class="h2">rawHash</text><text x="510" y="232" text-anchor="middle" class="formula">0 ≤ h &lt; 2³¹</text><path d="M635 210 H715" class="arrow"/>
  <rect x="720" y="150" width="300" height="120" class="box" fill="#fff4e5" stroke="#d35400"/><text x="870" y="192" text-anchor="middle" class="h2">Quotient–remainder</text><text x="870" y="228" text-anchor="middle" class="formula">r=h%M, q=h/M</text><text x="870" y="255" text-anchor="middle" class="small">orderHash=prefix(r)+q</text><path d="M1020 210 H1100" class="arrow"/>
  <rect x="1105" y="150" width="280" height="120" class="box" fill="#e7f4e8" stroke="#2e8b3c"/><text x="1245" y="195" text-anchor="middle" class="h2">QueryKey</text><text x="1245" y="232" text-anchor="middle" class="small">stateId + orderHash + key</text>
  <path d="M1245 270 V315 H355 V345" class="arrow"/><text x="60" y="330" class="h2">Three-tier storage path</text>
  <g transform="translate(200,350)"><rect x="0" y="0" width="310" height="120" class="box" fill="#dce9f7" stroke="#2f77c5"/><text x="155" y="46" text-anchor="middle" class="h2">FreshTable</text><text x="155" y="82" text-anchor="middle" class="small">Continuous q improves bucket use</text><path d="M310 60 H405" class="arrow"/><rect x="410" y="0" width="310" height="120" class="box" fill="#f2f4f7" stroke="#64748b"/><text x="565" y="46" text-anchor="middle" class="h2">SliceTable</text><text x="565" y="82" text-anchor="middle" class="small">Decode key-group / route</text><path d="M720 60 H815" class="arrow"/><rect x="820" y="0" width="310" height="120" class="box" fill="#e7f4e8" stroke="#2e8b3c"/><text x="975" y="46" text-anchor="middle" class="h2">LsmStore</text><text x="975" y="82" text-anchor="middle" class="small">Contiguous groups / order range</text></g>
  <path d="M765 470 V510 H800" stroke="#1f2937" stroke-width="4" fill="none"/><path d="M1175 470 V510 H800 V525" class="arrow"/><rect x="650" y="530" width="300" height="78" class="box" fill="#f2f4f7" stroke="#64748b"/><text x="800" y="562" text-anchor="middle" class="h2">Ordered internal keys</text><text x="800" y="590" text-anchor="middle" class="small">Slice + LSM merge / order range</text>
  <path d="M800 608 V630 H505 V645" class="arrow"/><path d="M800 630 H1095 V645" class="arrow"/>
  <rect x="245" y="650" width="520" height="125" class="box" fill="#fff4e5" stroke="#d35400"/><text x="505" y="692" text-anchor="middle" class="h2">Checkpoint / Restore Filter</text><text x="505" y="727" text-anchor="middle" class="small">orderHash → keyGroup → range filter</text><text x="505" y="753" text-anchor="middle" class="small">Keep only target key-groups</text>
  <rect x="835" y="650" width="520" height="125" class="box" fill="#e7f4e8" stroke="#2e8b3c"/><text x="1095" y="692" text-anchor="middle" class="h2">Savepoint Iterator</text><text x="1095" y="727" text-anchor="middle" class="small">Iterate orderHash and recover key-group</text><text x="1095" y="753" text-anchor="middle" class="small">Non-decreasing key-group output</text>
  <rect x="160" y="825" width="1280" height="90" class="box" fill="#eef5fc" stroke="#2f77c5"/><text x="205" y="864" class="h2">Application result</text><text x="430" y="864" class="body">One orderHash supports memory buckets, tier routing, file filtering, and Savepoint order.</text><text x="205" y="895" class="small">The algorithm spans writes, tiered storage, restore filtering, and export; it is not an isolated mathematical transform.</text>
</svg>
