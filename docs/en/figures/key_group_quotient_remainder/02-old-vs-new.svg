<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#1f2937"/></marker>
    <style>.title{font:700 36px "Noto Sans",Arial,sans-serif;fill:#17365d}.h2{font:700 27px "Noto Sans",Arial,sans-serif;fill:#17365d}.body{font:500 22px "Noto Sans",Arial,sans-serif;fill:#1f2937}.small{font:500 19px "Noto Sans",Arial,sans-serif;fill:#374151}.formula{font:700 22px Consolas,monospace;fill:#17365d}.arrow{stroke:#1f2937;stroke-width:4;fill:none;marker-end:url(#arrow)}.box{stroke-width:2;rx:14}</style>
    <pattern id="cut" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="12" stroke="#d35400" stroke-width="3"/></pattern>
  </defs>
  <rect width="1600" height="900" fill="#fff"/><text x="60" y="68" class="title">High-Bit Overwrite vs. Quotient–Remainder Reordering</text>
  <text x="70" y="140" class="h2">Old scheme: write a key-group prefix</text><text x="70" y="178" class="small">Makes groups contiguous but overwrites high rawHash bits. Field widths are illustrative, not proportional.</text>
  <g transform="translate(90,225)">
    <rect x="0" y="0" width="1180" height="86" fill="#f2f4f7" stroke="#64748b" stroke-width="2"/><text x="590" y="52" text-anchor="middle" class="body">rawHash: 31 bits of information</text><path d="M590 316 V365" class="arrow" transform="translate(0,-5)"/>
    <rect x="0" y="145" width="420" height="90" fill="#fff4e5" stroke="#d35400" stroke-width="2"/><rect x="420" y="145" width="760" height="90" fill="#f2f4f7" stroke="#64748b" stroke-width="2"/>
    <text x="210" y="198" text-anchor="middle" class="body">keyGroup prefix</text><text x="800" y="198" text-anchor="middle" class="body">low rawHash bits</text><rect x="0" y="0" width="420" height="86" fill="url(#cut)" opacity=".8"/>
    <text x="1370" y="175" text-anchor="middle" class="h2" fill="#9b2c2c">Overwritten</text><text x="1370" y="210" text-anchor="middle" class="small">High-bit information lost</text>
  </g>
  <line x1="70" y1="520" x2="1530" y2="520" stroke="#cbd5e1" stroke-width="2"/>
  <text x="70" y="585" class="h2">New scheme: renumber the complete space</text><text x="70" y="623" class="small">Derive unique coordinates (r,q), then concatenate by key-group.</text>
  <rect x="90" y="665" width="300" height="100" class="box" fill="#dce9f7" stroke="#2f77c5"/><text x="240" y="707" text-anchor="middle" class="body">rawHash</text><text x="240" y="741" text-anchor="middle" class="formula">h</text><path d="M390 715 H485" class="arrow"/>
  <rect x="490" y="665" width="320" height="100" class="box" fill="#fff4e5" stroke="#d35400"/><text x="650" y="707" text-anchor="middle" class="body">Unique coordinates</text><text x="650" y="741" text-anchor="middle" class="formula">(r=h%M, q=h/M)</text><path d="M810 715 H905" class="arrow"/>
  <rect x="910" y="665" width="320" height="100" class="box" fill="#e7f4e8" stroke="#2e8b3c"/><text x="1070" y="707" text-anchor="middle" class="body">Contiguous position</text><text x="1070" y="741" text-anchor="middle" class="formula">prefix(r)+q</text><path d="M1230 715 H1325" class="arrow"/>
  <rect x="1330" y="665" width="200" height="100" class="box" fill="#eef5fc" stroke="#2f77c5"/><text x="1430" y="707" text-anchor="middle" class="body">orderHash</text><text x="1430" y="741" text-anchor="middle" class="small">No collisions or gaps</text>
  <rect x="160" y="810" width="1280" height="62" class="box" fill="#eef5fc" stroke="#2f77c5"/><text x="200" y="849" class="h2">Root-cause fix</text><text x="420" y="849" class="body">Reorder all 2³¹ positions bijectively instead of overwriting selected bits.</text>
</svg>
