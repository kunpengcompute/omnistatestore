name: OmniStateStore-PR

on:
  pull_request_target:
    types:
      - open
      - reopen
      - update
    branches: ['*']

  pr_comment:
    types: [created]
    comments: ['^/retest$']

  pull_request_comment:
    types: [created]
    comments: ['^/retest$']
    branches: ['*']

env:
  PR_ID: ${{ atomgit.event.pull_request.number }}
  TARGET_BRANCH: ${{ atomgit.event.pull_request.base.ref }}
  HEAD_SHA: ${{ atomgit.event.pull_request.head.sha }}

defaults:
  run:
    shell: bash

concurrency:
  enable: true
  max: 3
  exceed-action: QUEUE
  preemption:
    enable: true
    events: [mr_id]

permissions:
  repository: read
  pr: write
  issue: none
  note: none
  project: none

jobs:
  mark_running:
    name: Mark running
    runs-on: [self-hosted, openeuler, x86, cpu=16]

    steps:
      - name: Mark PR as running
        if: ${{ atomgit.event.pull_request.number != '' }}
        uses: openlibing/pr-label-action@v1.0.0
        with:
          add_labels: ci-pipeline-running
          remove_labels: ci-pipeline-passed,ci-pipeline-failed

  validation:
    name: Build and test
    needs: [mark_running]
    uses: ./.gitcode/workflows/pr-ci.yml
    with:
      pr_id: ${{ atomgit.event.pull_request.number }}
      target_branch: ${{ atomgit.event.pull_request.base.ref }}
      head_sha: ${{ atomgit.event.pull_request.head.sha }}

  report_result:
    name: Report result
    needs: [mark_running, validation]
    if: ${{ always() }}
    runs-on: [self-hosted, openeuler, x86, cpu=16]

    steps:
      - name: Set result label
        uses: openlibing/pr-label-action@v1.0.0
        with:
          add_labels: ${{ needs.mark_running.result == 'success' && needs.validation.result == 'success' && 'ci-pipeline-passed' || 'ci-pipeline-failed' }}
          remove_labels: ci-pipeline-running,${{ needs.mark_running.result == 'success' && needs.validation.result == 'success' && 'ci-pipeline-failed' || 'ci-pipeline-passed' }}