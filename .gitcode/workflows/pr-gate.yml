name: OmniStateStore-PR

on:
  pull_request_target:
    types:
      - open
      - reopen
      - update
    branches: ['*']

  pr_comment:
    types: [created]
    comments: ['^/retest$']

  pull_request_comment:
    types: [created]
    comments: ['^/retest$']
    branches: ['*']

env:
  PR_ID: ${{ atomgit.event.pull_request.number }}
  TARGET_BRANCH: ${{ atomgit.event.pull_request.base.ref }}
  HEAD_SHA: ${{ atomgit.event.pull_request.head.sha }}
  REPO_FULL_NAME: ${{ atomgit.event.repository.full_name }}

defaults:
  run:
    shell: bash

concurrency:
  enable: true
  max: 3
  exceed-action: QUEUE
  preemption:
    enable: true
    events: [mr_id]

permissions:
  repository: read
  pr: write
  issue: read
  note: none
  id-token: write
  project: none

jobs:
  mark_running:
    name: Mark running
    runs-on: [self-hosted, ubse, x86, cpu=4]

    steps:
      - name: Mark PR as running
        if: ${{ atomgit.event.pull_request.number != '' }}
        uses: openlibing/pr-label-action@v1.0.0
        with:
          add_labels: ci-pipeline-running
          remove_labels: ci-pipeline-passed,ci-pipeline-failed

  check_code:
    name: check_code
    needs: [mark_running]
    runs-on: [self-hosted, ubse, x86, cpu=4]
    timeout-minutes: 100

    steps:
      - name: Run OpenLibing code check
        env:
          OPENLIBING_AK: ${{ secrets.OPENLIBING_AK }}
          OPENLIBING_SK: ${{ secrets.OPENLIBING_SK }}
        run: |
          set -euo pipefail

          command -v git >/dev/null 2>&1 ||
            sudo yum install -y git
          command -v python3 >/dev/null 2>&1 ||
            sudo yum install -y python3 python3-pip

          if ! python3 -c 'import requests' >/dev/null 2>&1; then
            python3 -m pip --version >/dev/null 2>&1 ||
              sudo yum install -y python3-pip
            sudo python3 -m pip install \
              --index-url https://repo.huaweicloud.com/repository/pypi/simple \
              --trusted-host repo.huaweicloud.com \
              requests
          fi

          checker_dir="$(mktemp -d "${RUNNER_TEMP:-/tmp}/code-check.XXXXXX")"
          trap 'rm -rf -- "${checker_dir}"' EXIT

          git clone \
            --depth 1 \
            --filter=blob:none \
            --sparse \
            https://gitcode.com/openeuler/openeuler-jenkins.git \
            "${checker_dir}"

          git -C "${checker_dir}" sparse-checkout set src
          export PYTHONPATH="${checker_dir}${PYTHONPATH:+:${PYTHONPATH}}"

          export code_create_ak="${OPENLIBING_AK}"
          export code_create_sk="${OPENLIBING_SK}"
          export code_result_ak="${OPENLIBING_AK}"
          export code_result_sk="${OPENLIBING_SK}"

          python3 - <<'PY'
          import os
          import sys

          from src.ac.acl.openlibing.check_code import CheckCode

          repo_full_name = os.environ["REPO_FULL_NAME"]
          community, repo = repo_full_name.split("/", 1)
          server_url = os.environ.get("ATOMGIT_SERVER_URL", "https://gitcode.com")

          pr_url = (
              f"{server_url.rstrip('/')}/{repo_full_name}"
              f"/merge_requests/{os.environ['PR_ID']}"
          )

          checker = CheckCode(
              workspace=os.environ.get("RUNNER_TEMP", "/tmp"),
              repo=repo,
          )
          result = checker(
              common_args={
                  "community": community,
                  "pr_url": pr_url,
                  "platform": "atomgit",
                  "pr_num": os.environ["PR_ID"],
              }
          )

          status = ["SUCCESS", "WARNING", "FAILED", "EXCLUDE"][result.val]
          print(f"Code Check result: {status}")
          for detail in result.details:
              print(f"  -> {detail}")

          if status not in {"SUCCESS", "WARNING", "EXCLUDE"}:
              sys.exit(1)
          PY

  issue_check:
    name: Issue check
    needs: [mark_running, check_code]
    runs-on: [self-hosted, ubse, x86, cpu=4]
    timeout-minutes: 10

    steps:
      - name: Check associated issue
        env:
          ATOMGIT_TOKEN: ${{ atomgit.token }}
        run: |
          set -euo pipefail

          branch_list=(
            'master'
            'openEuler-24.03-LTS-SP3'
            'br_bugfix_20260330'
            'br_BeiMing.26.0.RC1'
          )

          if printf '%s\n' "${branch_list[@]}" |
            grep -Fxq "${TARGET_BRANCH:-}"; then
            echo "分支 ${TARGET_BRANCH} 需要检查 Issue 关联。"
          else
            echo "分支 ${TARGET_BRANCH:-} 不需要检查 Issue 关联。"
            exit 0
          fi

          if ! rpm -q curl jq >/dev/null 2>&1; then
            sudo dnf install -y curl jq
          fi

          api_root="${ATOMGIT_API_URL:-https://api.gitcode.com}"
          api_root="${api_root%/}"
          api_root="${api_root%/v5}"
          api_root="${api_root%/v8}"
          api_root="${api_root%/api}"

          issues_url="${api_root}/api/v5/repos/${REPO_FULL_NAME}/pulls/${PR_ID}/issues"

          if ! issues_json="$(curl -fsSL \
            -H "PRIVATE-TOKEN: ${ATOMGIT_TOKEN}" \
            -H "Accept: application/json" \
            "${issues_url}" 2>/dev/null)"; then
            issues_json="$(curl -fsSL \
              -H "Authorization: token ${ATOMGIT_TOKEN}" \
              -H "Accept: application/json" \
              "${issues_url}")"
          fi

          issues_count="$(jq \
            'if type == "array" then length else -1 end' \
            <<<"${issues_json}")"

          if [[ "${issues_count}" == "0" ]]; then
            echo "PR #${PR_ID} 未关联 Issue，门禁失败。"
            exit 1
          fi

          if [[ "${issues_count}" -lt 0 ]]; then
            echo "获取 PR 关联 Issue 失败，接口返回内容不是数组。"
            exit 1
          fi

          if jq -e \
            'length > 0 and .[0].number != null' \
            <<<"${issues_json}" >/dev/null; then
            echo "PR #${PR_ID} 已关联 Issue。"
            exit 0
          fi

          echo "PR #${PR_ID} 返回了 Issue 数据，但没有有效的 Issue 编号。"
          exit 1

  check_sca:
    name: check_sca
    needs: [mark_running, issue_check]
    runs-on: [self-hosted, ubse, x86, cpu=4]
    timeout-minutes: 30

    steps:
      - name: Run OpenLibing SCA
        uses: openlibing/sca-action/sca-pr-action@v1.0.1
        with:
          project-name: OmniStateStore
          platform-domain: https://gitcode.com

  check_package_license:
    name: check_package_license
    needs: [mark_running, issue_check]
    runs-on: [self-hosted, ubse, x86, cpu=4]
    timeout-minutes: 20

    steps:
      - name: Run OpenEuler package license check
        run: |
          set -euo pipefail

          command -v git >/dev/null 2>&1 ||
            sudo yum install -y git
          command -v python3 >/dev/null 2>&1 ||
            sudo yum install -y python3 python3-pip

          if ! python3 -c 'import requests, chardet' >/dev/null 2>&1; then
            python3 -m pip --version >/dev/null 2>&1 ||
              sudo yum install -y python3-pip
            sudo python3 -m pip install \
              --index-url https://repo.huaweicloud.com/repository/pypi/simple \
              --trusted-host repo.huaweicloud.com \
              requests chardet
          fi

          checker_dir="$(mktemp -d "${RUNNER_TEMP:-/tmp}/license-check.XXXXXX")"
          trap 'rm -rf -- "${checker_dir}"' EXIT

          git clone \
            --depth 1 \
            --filter=blob:none \
            --sparse \
            https://gitcode.com/openeuler/openeuler-jenkins.git \
            "${checker_dir}"

          git -C "${checker_dir}" sparse-checkout set src
          export PYTHONPATH="${checker_dir}${PYTHONPATH:+:${PYTHONPATH}}"

          python3 - <<'PY'
          import os
          import sys

          from src.ac.acl.package_license.check_openeuler_license import (
              CheckOpeneulerLicense,
          )

          repo_full_name = os.environ["REPO_FULL_NAME"]
          community, repo = repo_full_name.split("/", 1)
          server_url = os.environ.get("ATOMGIT_SERVER_URL", "https://gitcode.com")

          pr_url = (
              f"{server_url.rstrip('/')}/{repo_full_name}"
              f"/merge_requests/{os.environ['PR_ID']}"
          )

          checker = CheckOpeneulerLicense(
              workspace=os.environ.get("RUNNER_TEMP", "/tmp"),
              repo=repo,
          )
          result = checker(
              common_args={
                  "community": community,
                  "pr_url": pr_url,
                  "platform": "atomgit",
                  "pr_num": os.environ["PR_ID"],
              }
          )

          status = ["SUCCESS", "WARNING", "FAILED", "EXCLUDE"][result.val]
          print(f"Package License result: {status}")
          for detail in result.details:
              print(f"  -> {detail}")

          if status == "FAILED":
              sys.exit(1)
          PY

  check_anti_poisoning:
    name: check_anti_poisoning
    needs: [mark_running, issue_check]
    runs-on: [self-hosted, ubse, x86, cpu=4]
    timeout-minutes: 15

    steps:
      - name: Run OpenLibing anti-poisoning check
        env:
          OPENLIBING_AK: ${{ secrets.OPENLIBING_AK }}
          OPENLIBING_SK: ${{ secrets.OPENLIBING_SK }}
        run: |
          set -euo pipefail

          command -v git >/dev/null 2>&1 ||
            sudo yum install -y git
          command -v python3 >/dev/null 2>&1 ||
            sudo yum install -y python3 python3-pip

          if ! python3 -c 'import requests' >/dev/null 2>&1; then
            python3 -m pip --version >/dev/null 2>&1 ||
              sudo yum install -y python3-pip
            sudo python3 -m pip install \
              --index-url https://repo.huaweicloud.com/repository/pypi/simple \
              --trusted-host repo.huaweicloud.com \
              requests
          fi

          checker_dir="$(mktemp -d "${RUNNER_TEMP:-/tmp}/anti-poison.XXXXXX")"
          trap 'rm -rf -- "${checker_dir}"' EXIT

          git clone \
            --depth 1 \
            --filter=blob:none \
            --sparse \
            https://gitcode.com/openeuler/openeuler-jenkins.git \
            "${checker_dir}"

          git -C "${checker_dir}" sparse-checkout set src
          export PYTHONPATH="${checker_dir}${PYTHONPATH:+:${PYTHONPATH}}"

          export anti_create_ak="${OPENLIBING_AK}"
          export anti_create_sk="${OPENLIBING_SK}"
          export anti_result_ak="${OPENLIBING_AK}"
          export anti_result_sk="${OPENLIBING_SK}"

          python3 - <<'PY'
          import os
          import sys

          from src.ac.acl.anti_poisoning.check_anti_poisoning import (
              CheckAntiPoisoning,
          )

          repo_full_name = os.environ["REPO_FULL_NAME"]
          community, repo = repo_full_name.split("/", 1)
          server_url = os.environ.get("ATOMGIT_SERVER_URL", "https://gitcode.com")

          pr_url = (
              f"{server_url.rstrip('/')}/{repo_full_name}"
              f"/merge_requests/{os.environ['PR_ID']}"
          )

          checker = CheckAntiPoisoning(
              workspace=os.environ.get("RUNNER_TEMP", "/tmp"),
              repo=repo,
          )
          result = checker(
              common_args={
                  "community": community,
                  "pr_url": pr_url,
                  "platform": "atomgit",
                  "pr_num": os.environ["PR_ID"],
              }
          )

          status = ["SUCCESS", "WARNING", "FAILED", "EXCLUDE"][result.val]
          print(f"Anti-Poisoning result: {status}")
          for detail in result.details:
              print(f"  -> {detail}")

          if status not in {"SUCCESS", "EXCLUDE"}:
              sys.exit(1)
          PY

  validation:
    name: Build and test
    needs: [mark_running, issue_check]
    uses: ./.gitcode/workflows/pr-ci.yml
    with:
      pr_id: ${{ atomgit.event.pull_request.number }}
      target_branch: ${{ atomgit.event.pull_request.base.ref }}
      head_sha: ${{ atomgit.event.pull_request.head.sha }}

  report_result:
    name: Report result
    needs:
      - mark_running
      - check_code
      - issue_check
      - check_sca
      - check_package_license
      - check_anti_poisoning
      - validation
    if: ${{ always() }}
    runs-on: [self-hosted, ubse, x86, cpu=4]

    steps:
      - name: Set result label
        uses: openlibing/pr-label-action@v1.0.0
        with:
          add_labels: ${{ needs.mark_running.result == 'success' && needs.check_code.result == 'success' && needs.issue_check.result == 'success' && needs.check_sca.result == 'success' && needs.check_package_license.result == 'success' && needs.check_anti_poisoning.result == 'success' && needs.validation.result == 'success' && 'ci-pipeline-passed' || 'ci-pipeline-failed' }}
          remove_labels: ci-pipeline-running,${{ needs.mark_running.result == 'success' && needs.check_code.result == 'success' && needs.issue_check.result == 'success' && needs.check_sca.result == 'success' && needs.check_package_license.result == 'success' && needs.check_anti_poisoning.result == 'success' && needs.validation.result == 'success' && 'ci-pipeline-failed' || 'ci-pipeline-passed' }}